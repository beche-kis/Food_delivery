AWSTemplateFormatVersion: '2010-09-09'
Description: >
    Food DEelivery Orders
    Creates the DynamoDB table for shared order state with optimistic locking.

Parameters:
    ProjectName:
      Type: String
      Default: delivery-shared-state
  
Resources:
  OrderStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-order-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      TimeToLiveSpecification:
          AttributeName: tt1
          Enabled: true

Outputs:
  OrderStateTableName:
    Value: !Ref OrderStateTable
    Export:
      Name: !Sub ${ProjectName}-OrderStateTable
